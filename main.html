<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Letter with Sound & Hearts</title>
    <style>
        body {
            margin: 0;
            background: #f8f0e5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #d3a561;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        .envelope:active {
            transform: scale(0.98);
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: #c2924d;
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top center;
            transition: transform 1s ease;
            z-index: 2;
        }

        .letter {
            position: absolute;
            bottom: -100%;
            left: 10%;
            width: 80%;
            height: 160px;
            background: white;
            border-radius: 4px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: bottom 1s ease;
            z-index: 1;
        }

        .letter p {
            margin: 0;
            font-size: 16px;
            color: #444;
        }

        .open .flap {
            transform: rotateX(-150deg);
        }

        .open .letter {
            bottom: 20px;
        }

        .heart {
            position: absolute;
            color: red;
            font-size: 24px;
            animation: float 3s linear forwards;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-200px) scale(1.5);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="envelope" onclick="openLetter(this)">
            <div class="flap"></div>
            <div class="letter">
                <p>Dear You,<br><br>This is your animated love letter. 💖<br><br>Yours truly,<br>HTML & CSS</p>
            </div>
        </div>
    </div>

    <!-- Soft sound effect -->
    <audio id="open-sound" src="https://cdn.pixabay.com/audio/2023/03/28/audio_9a57603b50.mp3" preload="auto"></audio>

    <script>
        function openLetter(el) {
            el.classList.toggle("open");

            const sound = document.getElementById("open-sound");

            if (el.classList.contains("open")) {
                sound.currentTime = 0;
                sound.play();

                for (let i = 0; i < 20; i++) {
                    createHeart();
                }
            }
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.bottom = "0";
            heart.innerHTML = "❤️";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }
    </script>
</body>

</html>
